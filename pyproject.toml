[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jpomop"
version = "0.0.1"
description = "Convert Japanese DPC inpatient data to the OMOP Common Data Model v5.4"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Koji Miyazawa" }]
dependencies = [
  "pyarrow>=16",
  "duckdb>=1.0",
  "pyyaml>=6",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
jpomop = "jpomop.cli:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
