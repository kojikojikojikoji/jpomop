[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jpomop"
version = "0.0.1"
description = "Convert Japanese DPC inpatient data to the OMOP Common Data Model v5.4"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Koji Miyazawa" }]
dependencies = [
  "pyarrow>=16",
  "duckdb>=1.0",
  "pyyaml>=6",
  "click>=8.1",
]

[project.optional-dependencies]
vocab = ["openpyxl>=3.1"]
dev = ["openpyxl>=3.1", "pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
jpomop = "jpomop.cli:main"

[tool.ruff]
line-length = 100
# The notebooks keep imports next to the step that uses them.
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
# Japanese text uses full-width characters on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "openpyxl"]
ignore_missing_imports = true
